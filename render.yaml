services:
  - type: web
    name: paicture-extractor
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && PLAYWRIGHT_BROWSERS_PATH=0 pnpm exec playwright install chromium
    startCommand: node server/extractor.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: CHATGPT_EXTRACTOR_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://paicture.lawrancehii12345.chatgpt.site
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: MAX_QUEUED_JOBS
        value: "12"
