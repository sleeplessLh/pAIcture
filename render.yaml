services:
  - type: web
    name: paicture-extractor
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm exec playwright install chromium
    startCommand: node server/extractor.mjs
    healthCheckPath: /health
    envVars:
      - key: CHATGPT_EXTRACTOR_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://paicture.lawrancehii12345.chatgpt.site
